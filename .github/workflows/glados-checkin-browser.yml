# GLaDOS 签到（浏览器版）— 使用 Playwright 真实浏览器，自动完成 Cloudflare Turnstile
name: GLaDOS 签到 (Browser)

on:
  schedule:
    # UTC 1:30 = 北京时间 9:30
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  checkin:
    name: 浏览器签到
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Playwright 及 Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 执行浏览器签到
        env:
          GLADOS_EMAIL_1: ${{ secrets.GLADOS_EMAIL_1 }}
          GLADOS_COOKIE_1: ${{ secrets.GLADOS_COOKIE_1 }}
          GLADOS_EMAIL_2: ${{ secrets.GLADOS_EMAIL_2 }}
          GLADOS_COOKIE_2: ${{ secrets.GLADOS_COOKIE_2 }}
          GLADOS_EMAIL_3: ${{ secrets.GLADOS_EMAIL_3 }}
          GLADOS_COOKIE_3: ${{ secrets.GLADOS_COOKIE_3 }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        # 使用 xvfb 虚拟显示以 headed 模式运行，降低被 Turnstile 识别的概率
        run: xvfb-run -a python checkin_browser.py

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
