# .github/workflows/glados-checkin.yml

name: GLaDOS 每日自动签到

on:
  # GLaDOS 已升级反作弊（challenge + Turnstile），纯 HTTP 方式不可用。
  # 定时签到请使用 glados-checkin-browser.yml（Playwright 浏览器版）。
  # 允许手动触发，方便调试
  workflow_dispatch:

jobs:
  checkin:
    name: 执行签到
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 执行签到脚本
        env:
          # 将 GitHub Secrets 注入为环境变量
          GLADOS_EMAIL_1: ${{ secrets.GLADOS_EMAIL_1 }}
          GLADOS_COOKIE_1: ${{ secrets.GLADOS_COOKIE_1 }}
          GLADOS_EMAIL_2: ${{ secrets.GLADOS_EMAIL_2 }}
          GLADOS_COOKIE_2: ${{ secrets.GLADOS_COOKIE_2 }}
          GLADOS_EMAIL_3: ${{ secrets.GLADOS_EMAIL_3 }}
          GLADOS_COOKIE_3: ${{ secrets.GLADOS_COOKIE_3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python checkin.py
